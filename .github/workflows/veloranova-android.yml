name: VeloraNova Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'veloranova/**'
      - '.github/workflows/veloranova-android.yml'
  pull_request:
    paths:
      - 'veloranova/**'
      - '.github/workflows/veloranova-android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: veloranova
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify Android permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          permissions=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk")
          echo "$permissions"
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' <<< "$permissions"; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VeloraNova-debug
          path: veloranova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
