plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veloranova.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.veloranova.editor'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ".sizecheck"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-transformer:1.6.1'
}
